openapi: 3.0.3
info:
  title: Poolside Browser API
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/license/mit
  description: |
    API local que controla Poolside mediante la sesión autenticada de Chrome.
    La extensión local ejecuta las solicitudes dentro de chat.poolside.ai,
    por lo que la API no almacena cookies ni credenciales.
servers:
  - url: http://127.0.0.1:3100
    description: Servidor local
security:
  - PoolsideApiToken: []
tags:
  - name: Public
    description: Operaciones destinadas al consumidor de la API
  - name: Internal
    description: Comunicación interna con la extensión de Chrome
paths:
  /health:
    get:
      tags: [Public]
      operationId: getHealth
      security: []
      summary: Comprueba el estado del servicio
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/Forbidden'
  /chats:
    get:
      tags: [Public]
      operationId: listChats
      summary: Lista conversaciones recientes
      responses:
        '200':
          description: Conversaciones visibles en la cuenta autenticada
          content:
            application/json:
              schema:
                type: object
                required: [chats]
                properties:
                  chats:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      tags: [Public]
      operationId: createChat
      summary: Crea una conversación vacía para un contexto limpio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
            example:
              title: Investigación de mercado independiente
              model: poolside/laguna-s-2.1
      responses:
        '201':
          description: Conversación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedChat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /chats/{chatId}:
    get:
      tags: [Public]
      operationId: getChat
      summary: Recupera el estado y mensajes de una conversación
      parameters:
        - $ref: '#/components/parameters/ChatId'
      responses:
        '200':
          description: Estado de la conversación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /message:
    post:
      tags: [Public]
      operationId: sendMessage
      summary: Envía un mensaje y espera la respuesta completa
      description: |
        Envía el mensaje mediante la pestaña autenticada de Poolside y consume
        su respuesta en streaming antes de devolver el texto final.
        El campo `attachments` todavía no está implementado: si se envía, la
        API responde 400 en lugar de ignorarlo en silencio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
            examples:
              basic:
                value:
                  message: Responde únicamente OK
              configured:
                value:
                  message: Resume este tema en tres puntos
                  chatId: zU2tyjHTTsi4FwaLiGCP6VvV
                  model: poolside/laguna-xs-2.1
                  thinking: false
                  webSearch: true
      responses:
        '200':
          description: Respuesta completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: No hay ninguna conversación disponible a la que enviar el mensaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /bridge/next:
    get:
      tags: [Internal]
      operationId: getBridgeCommand
      summary: Obtiene el siguiente comando para la extensión
      description: |
        Cada sondeo marca el puente como conectado. Los comandos que expiran
        antes de ser recogidos se descartan y nunca se entregan.
      responses:
        '200':
          description: Comando pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeCommand'
        '204':
          description: No hay comandos pendientes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /bridge/result:
    post:
      tags: [Internal]
      operationId: submitBridgeResult
      summary: Devuelve el resultado de un comando de la extensión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, ok]
              properties:
                id: { type: string }
                ok: { type: boolean }
                result: {}
                error: { type: string }
      responses:
        '202':
          description: Resultado aceptado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Comando inexistente o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
components:
  securitySchemes:
    PoolsideApiToken:
      type: apiKey
      in: header
      name: X-Poolside-API-Token
      description: Token local de al menos 32 caracteres configurado mediante POOLSIDE_API_TOKEN.
  parameters:
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
      example: zU2tyjHTTsi4FwaLiGCP6VvV
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token de API inválido o ausente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Origen no permitido por la política CORS
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: El cuerpo supera 200 000 bytes o el mensaje 100 000 caracteres
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Error interno de la API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Poolside o la extensión devolvieron una respuesta inutilizable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: No hay puente de Chrome ni pestaña autenticada disponible, o la cola del puente está saturada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayTimeout:
      description: La extensión no recogió el comando o no respondió a tiempo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [ok, service, port, bridge]
      properties:
        ok: { type: boolean, example: true }
        service: { type: string, example: poolside-browser-api }
        port: { type: integer, example: 3100 }
        bridge: { type: boolean, example: true }
    ChatSummary:
      type: object
      required: [id, title, url]
      properties:
        id: { type: string }
        title: { type: string }
        updatedAt: { type: integer, format: int64, nullable: true }
        isGenerating: { type: boolean }
        url: { type: string, format: uri }
    CreateChatRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 1000
        model:
          type: string
          enum:
            - poolside/laguna-s-2.1
            - poolside/laguna-xs-2.1
          default: poolside/laguna-s-2.1
    CreatedChat:
      type: object
      required: [id, title, url]
      properties:
        id: { type: string }
        title: { type: string }
        url: { type: string, format: uri }
    MessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 100000
        chatId:
          type: string
          description: Si se omite, usa la conversación actual o la más reciente.
        model:
          type: string
          enum:
            - poolside/laguna-s-2.1
            - poolside/laguna-xs-2.1
          default: poolside/laguna-s-2.1
        thinking:
          type: boolean
          default: true
        webSearch:
          type: boolean
          default: true
    MessageResponse:
      type: object
      required: [chatId, model, options, response]
      properties:
        chatId: { type: string }
        model: { type: string }
        options:
          type: object
          properties:
            thinking: { type: boolean }
            webSearch: { type: boolean }
        response: { type: string }
    ChatState:
      type: object
      description: Estado devuelto por Poolside, incluyendo mensajes y generación.
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        messageCount: { type: integer }
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
    BridgeCommand:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador que la extensión debe devolver en /bridge/result.
        type:
          type: string
          enum: [listChats, getChat, createChat, sendMessage]
        chatId: { type: string }
        payload:
          type: object
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
