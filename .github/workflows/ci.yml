name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check server.mjs
      - run: node --check chrome-bridge/content.js
      - run: node --check chrome-bridge/service-worker.js
      - run: node --check chrome-bridge/options.js
      - run: node --check examples/local-file-agent.mjs
      - run: node --check examples/delegated-workspace-agent.mjs
      - run: node --check examples/kdd-coding-subagent.mjs
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      # Versión fijada: 'latest' haría el CI irreproducible y dependiente de una
      # publicación de terceros.
      - run: npx --yes @redocly/cli@2.40.0 lint openapi.yaml
