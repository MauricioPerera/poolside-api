<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Poolside Local API Bridge</title>
  </head>
  <body>
    <main>
      <h1>Poolside Local API Bridge</h1>
      <p>Introduce el mismo token configurado en <code>POOLSIDE_API_TOKEN</code>.</p>
      <label for="token">Token de API</label>
      <input id="token" type="password" autocomplete="off" minlength="32" required>
      <button id="save" type="button">Guardar</button>
      <p id="status" role="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
